[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-mcp"
version = "0.0.2"
description = "Model Context Protocol (MCP) server for StreamWright declarative ELT framework"
authors = [
    {name = "Karthick Jaganathan", email = "kjaganathan.sde@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.0.0",
    "streamwright>=0.1.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "requests>=2.25.0",
    "sqlglot>=20.0.0",
]

[project.urls]
Homepage = "https://streamwright.web.app"
Documentation = "https://streamwright.web.app/docs/ai/mcp"
Repository = "https://github.com/karthick-jaganathan/streamwright-mcp"
"Issue Tracker" = "https://github.com/karthick-jaganathan/streamwright-mcp/issues"

[project.scripts]
streamwright-mcp = "streamwright_mcp.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
