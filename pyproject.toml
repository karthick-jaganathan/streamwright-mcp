[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-mcp"
version = "0.0.4"
description = "Model Context Protocol (MCP) server for StreamWright declarative ELT framework"
authors = [
    {name = "Karthick Jaganathan", email = "kjaganathan.sde@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=2.3,<3",
    "streamwright~=0.1.11",
]

[project.urls]
Homepage = "https://streamwright.web.app"
Documentation = "https://streamwright.web.app/docs/ai/mcp"
Repository = "https://github.com/karthick-jaganathan/streamwright-mcp"
"Issue Tracker" = "https://github.com/karthick-jaganathan/streamwright-mcp/issues"

[project.scripts]
streamwright-mcp = "streamwright.mcp.cli:main"

[project.entry-points."streamwright.commands"]
mcp = "streamwright.mcp.cli:register"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
# `streamwright` is a namespace package shared with streamwright (core), streamwright-spark and the connectors;
# `streamwright_mcp` is the deprecated alias of streamwright.mcp
where = ["src"]
include = ["streamwright.mcp*", "streamwright_mcp*"]
