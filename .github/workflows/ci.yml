name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "streamwright~=0.1.11"
          # the protocol tests read real connector definitions (postgres, mongodb) from the core release tag
          for c in postgres mongodb; do
            pip install --no-deps "git+https://github.com/karthick-jaganathan/streamwright.git@v0.1.11#subdirectory=connectors/readers/$c"
          done
          pip install -e ".[test]" "ruff==0.17.3"

      # Blocking: ruff (ruff.toml) and scripts/check_code_standards.py (vendored from streamwright)
      - name: Check the code standards
        run: make lint

      - name: Check the generated tool reference
        run: python -m streamwright.mcp.docs --check docs/mcp.md

      - name: Run test suite
        run: pytest -v
