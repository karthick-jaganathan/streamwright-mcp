name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # core and the connector definitions the protocol tests read (postgres, mongodb) come from the core
          # release tag, so CI passes before that release reaches PyPI
          core="git+https://github.com/karthick-jaganathan/streamwright.git@v0.2.0"
          pip install "streamwright @ $core#subdirectory=core"
          for c in postgres mongodb; do
            pip install --no-deps "$core#subdirectory=connectors/readers/$c"
          done
          pip install -e ".[test]" "ruff==0.17.3"

      # Blocking: ruff (ruff.toml) and scripts/check_code_standards.py (vendored from streamwright)
      - name: Check the code standards
        run: make lint

      - name: Check the generated tool reference
        run: python -m streamwright.mcp.docs --check docs/mcp.md

      - name: Run test suite
        run: pytest -v
