# Code standards: the same rules as streamwright's ruff.toml (streamwright docs/design/connector-contract.md
# section 7), blocking through `make lint` (Makefile) and CI.
line-length = 120
target-version = "py311"
extend-exclude = ["**/build", "**/.venv", "dist"]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PL", "RUF", "N", "C90"]
# PLC0415 (import outside top level), PLW0603 (global statement) and RUF012 (mutable class attribute) are selected
# through PL and RUF; they are listed here to document that they are part of the standard.
extend-select = ["PLC0415", "PLW0603", "RUF012"]
ignore = [
    "PLR0913",  # too many arguments: keyword-only parameters are the API style of the SDK
    "PLR2004",  # magic value comparison: protocol constants read better inline
    "UP031",    # printf-style formatting is the codebase's style
]

[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-branches = 15
max-returns = 8
max-statements = 60

[lint.isort]
# streamwright.mcp (and its deprecated alias streamwright_mcp) is this package; streamwright core and the `mcp` SDK
# are dependencies (the package folder is named mcp too, so same-package detection would mistake the SDK for it)
known-first-party = ["streamwright.mcp", "streamwright_mcp"]
known-third-party = ["streamwright", "mcp"]
detect-same-package = false
split-on-trailing-comma = false

[lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "N802"]
